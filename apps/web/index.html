<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>YouIyouX</title>
    <meta name="description" content="YouIyouX: find, inspect and install design-language elements, and see where each one lives." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply a pinned theme before first paint; "system" leaves the attribute off.
      try {
        const theme = localStorage.getItem("yx-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
