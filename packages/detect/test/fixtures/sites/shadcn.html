<!doctype html>
<!-- shadcn/ui (new-york, Tailwind v4) on Radix Primitives, as rendered: shadcn's own data-slot names (the newer registry's too),
     Tailwind utilities, radix- ids, a Radix Colors gray scale, and a dialog that only exists once opened. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings · shadcn fixture</title>
<style>
  :root { --background: oklch(1 0 0); --foreground: oklch(0.145 0 0); --primary: oklch(0.205 0 0); --radius: 0.625rem;
    --gray-1: #fcfcfc; --gray-2: #f9f9f9; --gray-3: #f0f0f0; --gray-4: #e8e8e8; --gray-5: #e0e0e0; --gray-6: #d9d9d9; --gray-7: #cecece; --gray-8: #bbb; --gray-9: #8d8d8d; --gray-10: #838383; --gray-11: #646464; --gray-12: #202020; }
  body { margin: 0; padding: 24px; font-family: Inter, system-ui, sans-serif; color: var(--foreground); }
  .inline-flex { display: inline-flex; } .flex { display: flex; } .flex-col { flex-direction: column; } .gap-2 { gap: 8px; } .gap-6 { gap: 24px; }
  .h-9 { height: 36px; } .px-4 { padding-left: 16px; padding-right: 16px; } .py-6 { padding-top: 24px; padding-bottom: 24px; } .px-6 { padding-left: 24px; padding-right: 24px; } .p-6 { padding: 24px; }
  .items-center { align-items: center; } .rounded-md { border-radius: 6px; } .rounded-xl { border-radius: 12px; } .rounded-lg { border-radius: 8px; } .border { border: 1px solid var(--gray-6); }
  .bg-primary { background: var(--primary); } .text-primary-foreground { color: #fafafa; } .text-sm { font-size: 14px; } .font-medium { font-weight: 500; } .w-80 { width: 320px; }
  .bg-muted { background: var(--gray-3); } .p-1 { padding: 4px; } .h-7 { height: 28px; } .px-3 { padding-left: 12px; padding-right: 12px; } .bg-white { background: #fff; }
  .badge { display: inline-flex; padding: 2px 8px; border-radius: 6px; font-size: 12px; background: var(--gray-3); }
  .fixed { position: fixed; } .inset-0 { inset: 0; } .bg-black\/50 { background: rgb(0 0 0 / 50%); } .z-50 { z-index: 50; }
  .dialog { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 420px; background: #fff; }
</style>
</head>
<body>
  <div class="flex flex-col gap-6">
    <div data-slot="card" class="bg-card text-card-foreground flex flex-col gap-6 rounded-xl border py-6 shadow-sm w-80">
      <div data-slot="card-header" class="grid auto-rows-min items-start gap-2 px-6"><div data-slot="card-title" class="leading-none font-semibold">Profile</div>
        <span data-slot="badge" class="badge inline-flex items-center justify-center rounded-md border px-2 py-0.5 text-xs font-medium">Pro</span></div>
      <div data-slot="card-content" class="px-6">
        <div dir="ltr" data-orientation="horizontal" data-slot="tabs" class="flex flex-col gap-2">
          <div role="tablist" aria-orientation="horizontal" data-slot="tabs-list" class="bg-muted text-muted-foreground inline-flex h-9 w-fit items-center justify-center rounded-lg p-1" tabindex="0" data-orientation="horizontal">
            <button type="button" role="tab" aria-selected="true" aria-controls="radix-«r0»-content-account" data-state="active" id="radix-«r0»-trigger-account" data-slot="tabs-trigger" class="bg-white inline-flex h-7 flex-1 items-center justify-center gap-1.5 rounded-md border px-3 text-sm font-medium">Account</button>
            <button type="button" role="tab" aria-selected="false" aria-controls="radix-«r0»-content-password" data-state="inactive" id="radix-«r0»-trigger-password" data-slot="tabs-trigger" class="inline-flex h-7 flex-1 items-center justify-center gap-1.5 rounded-md px-3 text-sm font-medium">Password</button>
          </div>
          <div data-state="active" data-orientation="horizontal" role="tabpanel" aria-labelledby="radix-«r0»-trigger-account" id="radix-«r0»-content-account" data-slot="tabs-content" class="flex-1 outline-none">Your account.</div>
        </div>
      </div>
    </div>
    <div class="flex gap-2">
      <button data-slot="button" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium h-9 px-4 py-2 bg-primary text-primary-foreground shadow-xs">Save</button>
      <button data-slot="dialog-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="radix-«r2»" data-state="closed" class="inline-flex items-center justify-center gap-2 rounded-md text-sm font-medium h-9 px-4 border">Edit profile</button>
    </div>
    <!-- The newer registry components: field, input-group, button-group, item, empty, sidebar groups, progress track. -->
    <div data-slot="sidebar-group" class="relative flex w-80 flex-col p-1">
      <div data-slot="sidebar-group-label" class="flex h-7 items-center rounded-md px-3 text-sm font-medium">Workspace</div>
      <div data-slot="sidebar-group-content" class="text-sm">
        <ul data-slot="sidebar-menu" class="flex flex-col gap-2"><li data-slot="sidebar-menu-item" class="relative"><a data-slot="sidebar-menu-button" class="flex items-center gap-2 rounded-md p-1 text-sm">Members</a></li></ul>
      </div>
    </div>
    <div data-slot="field-set" class="flex flex-col gap-6 w-80">
      <div data-slot="field" role="group" class="flex flex-col gap-2">
        <label data-slot="field-label" for="handle" class="flex items-center gap-2 text-sm font-medium">Handle</label>
        <div data-slot="input-group" role="group" class="flex h-9 items-center rounded-md border">
          <div data-slot="input-group-addon" class="flex items-center px-3 text-sm">@</div>
          <input id="handle" data-slot="input-group-control" class="flex-1 rounded-md px-3 text-sm" value="ada">
        </div>
        <p data-slot="field-description" class="text-sm">Shown on your profile.</p>
      </div>
    </div>
    <div data-slot="button-group" role="group" class="flex w-fit items-center">
      <button data-slot="button" class="inline-flex items-center justify-center rounded-md text-sm font-medium h-9 px-4 border">Archive</button>
      <button data-slot="button" class="inline-flex items-center justify-center rounded-md text-sm font-medium h-9 px-4 border">Report</button>
    </div>
    <div data-slot="item-group" role="list" class="flex flex-col w-80">
      <div data-slot="item" class="flex items-center gap-2 rounded-md border p-1"><div data-slot="item-content" class="flex flex-1 flex-col gap-2"><div data-slot="item-title" class="text-sm font-medium">Two-factor</div><p data-slot="item-description" class="text-sm">Enabled</p></div></div>
    </div>
    <div data-slot="empty" class="flex flex-col items-center gap-6 rounded-lg border p-6 w-80">
      <div data-slot="empty-header" class="flex flex-col items-center gap-2"><div data-slot="empty-title" class="text-sm font-medium">No invoices</div></div>
    </div>
    <div data-slot="progress" role="progressbar" class="relative h-7 w-80 overflow-hidden rounded-md bg-muted"><div data-slot="progress-track" class="h-7 w-80"><div data-slot="progress-indicator" class="h-7 bg-primary" style="width: 40%"></div></div></div>
  </div>
  <script>
    // Radix renders the dialog into a portal at the end of body only while it is open.
    const trigger = document.querySelector('[data-slot="dialog-trigger"]');
    const close = () => { document.querySelectorAll("[data-portal]").forEach((n) => n.remove()); trigger.setAttribute("aria-expanded", "false"); trigger.dataset.state = "closed"; };
    trigger.addEventListener("click", () => {
      document.body.insertAdjacentHTML("beforeend", '<div data-portal data-state="open" data-slot="dialog-overlay" class="fixed inset-0 z-50 bg-black/50"></div>' +
        '<div data-portal role="dialog" id="radix-«r2»" aria-describedby="radix-«r4»" aria-labelledby="radix-«r3»" data-state="open" data-slot="dialog-content" class="dialog fixed z-50 grid gap-4 rounded-lg border p-6 shadow-lg" tabindex="-1">' +
        '<div data-slot="dialog-header" class="flex flex-col gap-2"><h2 id="radix-«r3»" data-slot="dialog-title" class="text-lg leading-none font-semibold">Edit profile</h2>' +
        '<p id="radix-«r4»" data-slot="dialog-description" class="text-muted-foreground text-sm">Make changes to your profile here.</p></div>' +
        '<button data-slot="button" class="inline-flex items-center justify-center rounded-md text-sm font-medium h-9 px-4 bg-primary text-primary-foreground">Save changes</button></div>');
      trigger.setAttribute("aria-expanded", "true"); trigger.dataset.state = "open";
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  </script>
</body>
</html>
