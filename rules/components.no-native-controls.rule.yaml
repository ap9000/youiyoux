$schema: ../schema/youi.rule.schema.json
schema: youi.rule/v1
id: youi:signal/rule/components.no-native-controls
title: Use the owned controls, not native elements
severity: warn
statement: Outside the components directory, render Button, Input and Textarea instead of styling <button>, <input> and <textarea> by hand.
rationale: Hand-styled controls skip the system's focus ring, 44px touch size, disabled state and theme, and they are invisible to the usage map.
agent: Use <Button>, <Input> and <Textarea> from the components directory; never style a native <button> yourself.
check:
  engine: youi
  id: native-element
  options:
    elements:
      button: youi:signal/component/button
      input: youi:signal/component/input
      textarea: youi:signal/component/textarea
    allowInputTypes:
      - hidden
      - checkbox
      - radio
      - file
      - range
      - color
files:
  - "**/*.tsx"
examples:
  bad:
    - <button className="rounded-md bg-black px-3 text-white">Save</button>
  good:
    - <Button>Save</Button>
