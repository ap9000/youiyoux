# Engine and hub checks on every push and pull request: tests, typechecks, the
# production build, and the download/search budgets (pnpm measure fails on a regression).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # System libraries only: the site tests download the headless shell itself, as youiyoux detect does.
      - name: System libraries for youiyoux detect's Chromium
        run: pnpm --filter @youiyoux/detect exec playwright-core install-deps chromium-headless-shell

      # youiyoux render (agent eyes) draws with the scanner's playwright-core and never downloads in tests.
      - name: Headless shell for youiyoux render's tests
        run: pnpm --filter @youiyoux/scanner exec playwright-core install chromium-headless-shell

      - name: Engine typecheck
        run: pnpm typecheck
      - name: Engine tests
        run: pnpm test
        env:
          YOUI_DETECT_SITE: "1"

      # The hub's specimen and Try it tests draw in the headless shell of the hub's own playwright-core,
      # which may be a different build from the one youiyoux detect downloads.
      - name: Headless shell for the hub's browser tests
        run: pnpm --filter @youiyoux/web exec playwright-core install chromium-headless-shell
      - name: Web tests
        run: pnpm --filter @youiyoux/web test
      - name: Web typecheck and build
        run: pnpm --filter @youiyoux/web build
      - name: Budgets (download incl. fonts, search)
        run: pnpm --filter @youiyoux/web measure
